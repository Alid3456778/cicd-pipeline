name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one run per branch; newer PR pushes cancel older PR runs,
# but a deployment that is already running is never cancelled halfway.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. CI: lint + tests (runs on every push and pull request)
  # ---------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ---------------------------------------------------------------
  # 2. Build the Docker image and push it to GitHub Container Registry
  #    (only on main / manual runs, never for pull requests)
  # ---------------------------------------------------------------
  build:
    name: Build & Push Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Docker image names must be lowercase
      - name: Compute image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3. Deploy to the server over SSH, with health check + auto-rollback
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_PORT: ${{ vars.APP_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy (pull image, restart container, health check, rollback on failure)
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf 'export IMAGE=%q\n' "$IMAGE"
            printf 'export HOST_PORT=%q\n' "$APP_PORT"
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat deploy/deploy.sh
          } | ssh -T -p "$SSH_PORT" -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=yes \
                -o ServerAliveInterval=30 \
                "$SSH_USER@$SSH_HOST" 'bash -s'

      # Optional: set a repository variable HEALTH_URL (e.g. http://YOUR_IP:8080/health)
      # to also verify from the outside that the new commit is the one being served.
      - name: Verify live version
        if: ${{ vars.HEALTH_URL != '' }}
        shell: bash
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          for i in $(seq 1 10); do
            body="$(curl -fsS --max-time 5 "$HEALTH_URL" || true)"
            live="$(echo "$body" | jq -r '.version // empty' 2>/dev/null || true)"
            echo "Attempt $i: live version = ${live:-<no response>}"
            if [ "$live" = "$EXPECTED" ]; then
              echo "Live version matches commit $EXPECTED"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live version does not match the deployed commit"
          exit 1

  # ---------------------------------------------------------------
  # 4. Optional failure notification (set the DISCORD_WEBHOOK_URL secret to enable)
  # ---------------------------------------------------------------
  notify:
    name: Notify on Failure
    needs: [test, build, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: "Pipeline FAILED for ${{ github.repository }} on ${{ github.ref_name }} (commit ${{ github.sha }}) - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping notification."
            exit 0
          fi
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
